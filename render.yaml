services:
  - type: web
    name: drive-zone-online
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
